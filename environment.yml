name: palimpzest
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip
  - setuptools>=70.1.1

  # CPU-only PyTorch stack from conda-forge.
  - pytorch-cpu
  - torchvision
  - torchaudio

  # Direct project dependencies from pyproject.toml.
  - anthropic>=0.79.0
  - beautifulsoup4>=4.13.4
  - colorama>=0.4.6
  - datasets>=4.0.0
  - fastapi>=0.115.0
  - google-genai>=1.0.0
  - numpy>=2.0.2
  - openai>=1.0
  - pandas>=2.1.1
  - pillow>=11.3.0
  - prettytable>=3.9.0
  - psutil>=5.9.5
  - pyld>=2.0.4
  - pyarrow>=20.0.0
  - pypdf>=5.1.0
  - pytest>=8.2.2
  - pytest-mock>=3.14.0
  - python-dotenv>=1.2.1
  - pyyaml>=6.0.1
  - requests>=2.25
  - rich>=13.9.2,<14
  - ruff>=0.9.0
  - sentence-transformers=5.0.0
  - starlette<1
  - tabulate>=0.9.0
  - together>=1.5.5
  - tqdm>=4.66.1,<5
  - websockets<16

  # Keep this cluster on pip for Python 3.13 compatibility and to avoid
  # conda-forge metadata conflicts around fastapi/gradio/litellm.
  - pip:
      - "chromadb>=1.0.15"
      - "gradio>=5.26.0"
      - "litellm>=1.81.11,<1.82.7"
      - "smolagents[toolkit]"
